<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="10;url=pembukaan.html">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Wedding Day — Fatimah &amp; Naravit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+SC:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --wine:#4a0b1a; --burgundy:#7a1230; --crimson:#a3203f;
    --rose:#e7a1b6; --gold:#ebcf93; --cream:#fcefd9;
    --breath:6.4s;            /* kecepatan napas pohon & bunga (SAMA semua) */
    --house-y:55%;            /* posisi tengah rumah (naik/turun) */
    --text-y:28%;             /* posisi tengah tulisan (naik/turun) */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#3f0816;overflow:hidden}
  body{display:flex;justify-content:center;align-items:center}

  /* ===== PANGGUNG: SELALU FULL TINGGI LAYAR (tanpa bar hitam atas/bawah) ===== */
  .stage{
    position:relative; overflow:hidden; isolation:isolate; flex:none;
    height:100vh; height:100dvh;
    width:calc(100vh * 9 / 16); width:calc(100dvh * 9 / 16);
    container-type:size;
    background:
      radial-gradient(ellipse 80% 55% at 50% 42%, rgba(231,161,182,.38), transparent 70%),
      radial-gradient(ellipse 120% 80% at 50% 100%, #9b1c3d 0%, transparent 60%),
      linear-gradient(180deg, #3f0816 0%, #6a1029 55%, #8a1a3a 100%);
  }
  /* motif batik kawung tipis */
  .batik{
    position:absolute; inset:0; z-index:0; opacity:.2;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' viewBox='0 0 80 80'><g fill='none' stroke='%23ebcf93' stroke-width='1.1'><ellipse cx='40' cy='20' rx='11' ry='19'/><ellipse cx='40' cy='60' rx='11' ry='19'/><ellipse cx='20' cy='40' rx='19' ry='11'/><ellipse cx='60' cy='40' rx='19' ry='11'/><circle cx='40' cy='40' r='2.2' fill='%23ebcf93'/></g></svg>");
    background-size:16cqw;
    -webkit-mask-image:radial-gradient(ellipse 85% 70% at 50% 45%, #000 20%, transparent 100%);
            mask-image:radial-gradient(ellipse 85% 70% at 50% 45%, #000 20%, transparent 100%);
  }
  .glow{position:absolute;left:50%;top:44%;width:90cqw;height:90cqw;translate:-50% -50%;z-index:1;
    background:radial-gradient(circle, rgba(255,205,215,.35), transparent 62%);opacity:0;transition:opacity 4s ease 1.5s}
  .stage.go .glow{opacity:1}
  .stage::after{content:"";position:absolute;inset:0;z-index:20;pointer-events:none;
    box-shadow:inset 0 0 14cqw rgba(30,2,10,.55)}

  /* ===== LAPISAN: .fly = gerak keluar (intro), .sw = gerak napas ===== */
  .fly{
    position:absolute; will-change:transform;
    transform:translate3d(var(--dx,0px),var(--dy,0px),0) scale(var(--s,1));
  }
  .stage.go .fly{
    transform:translate3d(0,0,0) scale(1);
    transition:transform var(--dur,3.4s) var(--ease,cubic-bezier(.65,0,.25,1)) var(--d,0s);
  }
  .stage.nofx .fly{transition:none!important;transform:translate3d(var(--dx,0px),var(--dy,0px),0) scale(var(--s,1))!important}
  .fly img,.fly .sw{display:block;width:100%;height:auto;-webkit-user-drag:none;user-select:none}
  .sw{will-change:transform;transform-origin:var(--o,50% 100%);
      animation:breath var(--breath) ease-in-out infinite alternate;animation-delay:var(--ph,0s)}
  @keyframes breath{
    from{transform:translate3d(calc(var(--tx,0%) * -1),0,0) rotate(calc(var(--a,1.5deg) * -1))}
    to  {transform:translate3d(var(--tx,0%),0,0) rotate(var(--a,1.5deg))}
  }
  .rev .sw{animation-direction:alternate-reverse}

  /* pohon */
  .pohon{bottom:9%;width:58%;z-index:2}
  .pohon.l{left:-12%} .pohon.r{right:-12%}
  .pohon .sw{--a:1.3deg;--tx:.8%;--o:50% 100%}

  /* rumah — gerak BEDA (melayang pelan, bukan goyang) */
  .rumah{left:0;width:100%;top:var(--house-y);height:0;z-index:3;display:flex;justify-content:center;align-items:center;pointer-events:none}
  .rumah .sw{flex:none;width:100%;animation:house 9.5s ease-in-out infinite alternate;transform-origin:50% 50%}
  @keyframes house{
    from{transform:translate3d(0,.6%,0) scale(1)}
    to  {transform:translate3d(0,-1.4%,0) scale(1.022)}
  }

  /* bunga3 — hamparan penuh di bawah */
  .row3{left:-8%;width:116%;bottom:-3%;z-index:5;display:flex}
  .row3 .it{flex:0 0 auto;width:36%;margin-left:-9%;position:relative}
  .row3 .it:first-child{margin-left:0}
  .row3 .it:nth-child(even){z-index:1}
  .row3 .it:nth-child(even) img{transform:scaleX(-1)}
  .row3 .sw{--a:1.1deg;--tx:2.2%}

  /* bunga1 — di depan bunga3 */
  .b1{bottom:-4%;z-index:6;width:40%}
  .b1.a{left:-7%} .b1.b{right:-7%} .b1.c{left:36%;width:28%;bottom:-6%}
  .b1 .sw{--a:2.2deg;--tx:1.2%}

  /* bunga4 — pojok atas, berotasi kiri-kanan */
  .b4{top:-10%;width:74%;z-index:7}
  .b4.l{left:-20%} .b4.r{right:-20%}
  .b4.l .sw{--o:0% 0%}  .b4.r .sw{--o:100% 0%}
  .b4 .sw{--a:5deg;--tx:0%}
  .b4.r img{transform:scaleX(-1)}

  /* ===== TULISAN ===== */
  .text{position:absolute;left:0;right:0;top:var(--text-y);transform:translateY(-50%);z-index:10;text-align:center;pointer-events:none;
        color:var(--cream);text-shadow:0 .4cqw 3cqw rgba(40,2,12,.9),0 0 .8cqw rgba(40,2,12,.8),0 0 6cqw rgba(255,190,205,.35)}
  /* bayangan lembut di belakang tulisan supaya nama lebih fokus */
  .text::before{content:"";position:absolute;left:50%;top:50%;width:112cqw;height:78cqw;translate:-50% -50%;z-index:-1;
        background:radial-gradient(ellipse at center, rgba(40,3,14,.62) 0%, rgba(40,3,14,.38) 42%, transparent 70%);
        opacity:0;transition:opacity 2.4s ease}
  .stage.show .text::before{opacity:1}
  .happy{font-family:'Cormorant SC','Cinzel',Georgia,serif;font-weight:600;
         font-size:5.2cqw;letter-spacing:1.1cqw;color:var(--gold);padding-left:1.1cqw}
  .names{margin-top:1.6cqw;font-family:'Pinyon Script','Great Vibes','Snell Roundhand',cursive;line-height:.9}
  .names .n{display:block;font-size:19.5cqw}
  .names .amp{display:block;font-size:10cqw;color:var(--rose);margin:0 0 -1cqw}
  .orn{display:block;margin:3cqw auto 0;width:40cqw;height:3cqw;opacity:0;transition:opacity 2s ease 2.6s}
  .stage.show .orn{opacity:.9}
  .ch{display:inline-block;opacity:0;filter:blur(1.4cqw);transform:translateY(1.6cqw) scale(1.08);white-space:pre}
  .stage.show .ch{animation:ink 1.5s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i) * 70ms)}
  @keyframes ink{to{opacity:1;filter:blur(0);transform:none}}

  /* kelopak jatuh */
  .petal{position:absolute;top:-6%;z-index:9;width:2.6cqw;height:3.6cqw;border-radius:80% 0 80% 0;
         background:linear-gradient(135deg,#ffc2d1,#d9456f);opacity:0;pointer-events:none;
         animation:fall var(--t) linear infinite;animation-delay:var(--w)}
  .stage.show .petal{opacity:.85}
  @keyframes fall{
    0%{transform:translate3d(0,0,0) rotate(0)}
    50%{transform:translate3d(var(--x),60cqh,0) rotate(200deg)}
    100%{transform:translate3d(calc(var(--x) * -.4),118cqh,0) rotate(420deg)}
  }

  /* kontrol kecil */
  .ui{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:30;display:flex;gap:8px}
  .ui button,.ui label{font:600 12px/1 system-ui,sans-serif;color:var(--cream);background:rgba(40,4,14,.55);
    border:1px solid rgba(235,207,147,.5);border-radius:99px;padding:8px 12px;cursor:pointer;backdrop-filter:blur(4px)}
  .ui button:focus-visible,.ui label:focus-within{outline:2px solid var(--gold);outline-offset:2px}
  .ui input{display:none}
  #pick{display:none}

  @media (prefers-reduced-motion:reduce){ .sw,.petal{animation-duration:30s} }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="batik"></div>
  <div class="glow"></div>

  <!-- POHON -->
  <div class="fly pohon l" data-g="tree"><div class="sw"><img data-key="pohon_1" alt=""></div></div>
  <div class="fly pohon r rev" data-g="tree"><div class="sw"><img data-key="pohon_2" alt=""></div></div>

  <!-- RUMAH (lebih besar) -->
  <div class="fly rumah" data-g="house"><div class="sw"><img data-key="rumah" alt=""></div></div>

  <!-- BUNGA 3 (hamparan bawah) -->
  <div class="fly row3" data-g="bottom">
    <div class="it"><div class="sw" style="--ph:-.2s"><img data-key="bunga3" alt=""></div></div>
    <div class="it"><div class="sw" style="--ph:-1.4s"><img data-key="bunga3" alt=""></div></div>
    <div class="it"><div class="sw" style="--ph:-.8s"><img data-key="bunga3" alt=""></div></div>
    <div class="it"><div class="sw" style="--ph:-2s"><img data-key="bunga3" alt=""></div></div>
  </div>

  <!-- BUNGA 1 -->
  <div class="fly b1 a" data-g="bottom"><div class="sw" style="--ph:-.6s"><img data-key="bunga1" alt=""></div></div>
  <div class="fly b1 b rev" data-g="bottom"><div class="sw" style="--ph:-1.6s"><img data-key="bunga1" alt=""></div></div>
  <div class="fly b1 c" data-g="bottom"><div class="sw" style="--ph:-1s"><img data-key="bunga1" alt=""></div></div>

  <!-- BUNGA 4 -->
  <div class="fly b4 l" data-g="b4"><div class="sw"><img data-key="bunga4" alt=""></div></div>
  <div class="fly b4 r rev" data-g="b4"><div class="sw"><img data-key="bunga4" alt=""></div></div>

  <!-- TULISAN -->
  <div class="text">
    <div class="happy" data-split>Happy Wedding Day</div>
    <div class="names">
      <span class="n" data-split>Fatimah</span>
      <span class="amp" data-split>&amp;</span>
      <span class="n" data-split>Naravit</span>
    </div>
    <svg class="orn" viewBox="0 0 200 20" fill="none" stroke="#ebcf93" stroke-width="1.2" stroke-linecap="round">
      <path d="M4 10h70M126 10h70"/><path d="M100 3c6 0 9 4 9 7s-3 7-9 7-9-4-9-7 3-7 9-7z"/>
      <circle cx="82" cy="10" r="2" fill="#ebcf93"/><circle cx="118" cy="10" r="2" fill="#ebcf93"/>
    </svg>
  </div>

</div>

  <div class="ui">
    <label id="pick"><input type="file" id="files" accept="image/png" multiple>Pilih foto PNG</label>
    <button id="replay" type="button" aria-label="Putar ulang">↻ Ulang</button>
  </div>

<script>
/* ============================================================
   1) ATUR NAMA FILE FOTO DI SINI (taruh satu folder dgn HTML ini)
   ============================================================ */
const SRC = {
  bunga4 : 'bunga4.png',
  bunga3 : 'bunga3.png',
  bunga1 : 'bunga1.png',
  pohon_1: 'pohon_1.png',
  pohon_2: 'pohon_2.png',
  rumah  : 'rumah.png'
};
/* Kalau foto belum ada, otomatis tampil gambar sementara (placeholder) */

const stage = document.getElementById('stage');
const imgs  = [...document.querySelectorAll('img[data-key]')];

/* ---------- placeholder SVG (hanya cadangan) ---------- */
const svg = s => 'data:image/svg+xml;utf8,' + encodeURIComponent(s);
function blossom(cx,cy,r,c1,c2){
  let p=''; for(let i=0;i<8;i++){const a=i*45;
    p+=`<ellipse cx="${cx}" cy="${cy-r*.62}" rx="${r*.36}" ry="${r*.62}" fill="${i%2?c1:c2}" transform="rotate(${a} ${cx} ${cy})"/>`}
  return p+`<circle cx="${cx}" cy="${cy}" r="${r*.2}" fill="#f4c25b"/>`;
}
const PH = {
  bunga4: svg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><path d="M0 0h300C260 90 190 120 120 200 70 250 30 270 0 300Z" fill="#2c5a3a"/>${blossom(70,80,60,'#f08aa5','#c2294f')}${blossom(170,60,44,'#ffc0d0','#e0587c')}${blossom(60,190,42,'#ffc0d0','#d93a65')}</svg>`),
  bunga3: svg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260"><path d="M0 260V150c60-40 110 10 200-20s150 10 200-10v140Z" fill="#2c5a3a"/>${blossom(70,150,52,'#ffc0d0','#d93a65')}${blossom(190,120,60,'#f08aa5','#a3203f')}${blossom(310,150,50,'#ffc0d0','#e0587c')}${blossom(130,215,40,'#f08aa5','#c2294f')}${blossom(260,220,44,'#ffc0d0','#d93a65')}</svg>`),
  bunga1: svg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380"><path d="M150 380V170" stroke="#2c5a3a" stroke-width="10"/><path d="M150 300c-60-10-90-50-100-90 50 0 90 30 100 90ZM150 270c60-10 90-50 100-90-50 0-90 30-100 90Z" fill="#3b7a4d"/>${blossom(150,120,95,'#ffc0d0','#c2294f')}</svg>`),
  pohon_1: svg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 620"><path d="M135 620c10-150 0-250-25-330h60c-25 80-15 180-5 330Z" fill="#5b3a2a"/><g fill="#2f6a42"><circle cx="150" cy="170" r="110"/><circle cx="80" cy="250" r="70"/><circle cx="225" cy="250" r="70"/><circle cx="150" cy="90" r="70"/></g><g fill="#ffb3c6" opacity=".85"><circle cx="110" cy="150" r="12"/><circle cx="190" cy="190" r="12"/><circle cx="150" cy="80" r="10"/><circle cx="85" cy="250" r="11"/><circle cx="220" cy="255" r="11"/></g></svg>`),
  rumah: svg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440"><path d="M350 20 480 150H220Z" fill="#8a3a2a"/><path d="M150 150h400l-40 60H190Z" fill="#a24a35"/><rect x="190" y="210" width="320" height="170" fill="#5b2a1c"/><rect x="310" y="240" width="80" height="140" rx="6" fill="#d8a85a"/><g fill="#e6c27a"><rect x="215" y="240" width="70" height="90" rx="4"/><rect x="415" y="240" width="70" height="90" rx="4"/></g><rect x="170" y="380" width="360" height="22" fill="#3b1810"/></svg>`)
};
PH.pohon_2 = PH.pohon_1;

/* ---------- muat gambar (fallback ke placeholder) ---------- */
let usedFallback = false;
function load(img, url){
  return new Promise(res=>{
    img.onload = ()=>res(); img.onerror = ()=>{ usedFallback = true; img.onerror=null; img.onload=()=>res(); img.src = PH[img.dataset.key]; };
    img.src = url;
  });
}
const loadAll = () => Promise.all(imgs.map(i => load(i, SRC[i.dataset.key])));

/* ---------- pecah teks jadi huruf ---------- */
let ci = 0;
document.querySelectorAll('[data-split]').forEach(el=>{
  const t = el.textContent; el.textContent = ''; el.setAttribute('aria-label', t);
  [...t].forEach(ch=>{ const s=document.createElement('span'); s.className='ch'; s.style.setProperty('--i', ci++); s.textContent=ch; s.setAttribute('aria-hidden','true'); el.appendChild(s); });
});

/* ---------- kelopak ---------- */
for(let i=0;i<16;i++){
  const p=document.createElement('i'); p.className='petal';
  p.style.left=(Math.random()*100)+'%';
  p.style.setProperty('--t',(9+Math.random()*7)+'s');
  p.style.setProperty('--w',(-Math.random()*14)+'s');
  p.style.setProperty('--x',((Math.random()-.5)*28)+'cqw');
  p.style.scale=(.7+Math.random()*.8);
  stage.appendChild(p);
}

/* ---------- INTRO: kumpul di tengah → perlahan menjauh ---------- */
/* s = ukuran saat menumpuk di tengah, d = jeda mulai, t = lama bergerak (detik) */
const CFG = {
  tree  :{ s:1.8, d:.4,  t:3.4 },
  b4    :{ s:1.9, d:.4,  t:3.4 },
  bottom:{ s:1.7, d:1.3, t:3.0 },
  house :{ s:.6,  d:0,   t:4.6, ease:'cubic-bezier(.2,.7,.2,1)' }   // rumah membesar dari jauh
};
const SHOW_AT = 3800;     // ms: kapan tulisan muncul
const LOOP    = false;    // true = ulang otomatis terus
let timer;
function start(){
  clearTimeout(timer);
  stage.classList.remove('go','show');
  stage.classList.add('nofx');
  const sr = stage.getBoundingClientRect(), cx = sr.left+sr.width/2, cy = sr.top+sr.height*.5;
  const flys = [...stage.querySelectorAll('.fly')];
  flys.forEach(f=>{ f.style.setProperty('--dx','0px'); f.style.setProperty('--dy','0px'); f.style.setProperty('--s','1'); });
  const rects = flys.map(f=>f.getBoundingClientRect());
  flys.forEach((f,k)=>{
    const r=rects[k], g=f.dataset.g;
    f.style.setProperty('--dx', (cx-(r.left+r.width/2))+'px');
    f.style.setProperty('--dy', (cy-(r.top+r.height/2))+'px');
    const c = CFG[g];
    f.style.setProperty('--s', c.s);
    f.style.setProperty('--d', c.d+'s');
    f.style.setProperty('--dur', c.t+'s');
    f.style.setProperty('--ease', c.ease || 'cubic-bezier(.65,0,.25,1)');
  });
  void stage.offsetWidth;                       // paksa reflow
  stage.classList.remove('nofx');
  void stage.offsetWidth;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    stage.classList.add('go');
    timer = setTimeout(()=>stage.classList.add('show'), SHOW_AT);
    if(LOOP) setTimeout(start, SHOW_AT + 11000);
  }));
}

/* ---------- pilih foto manual (kalau file belum sejajar dgn HTML) ---------- */
const norm = s => s.toLowerCase().replace(/\.[a-z0-9]+$/,'').replace(/[^a-z0-9]/g,'');
const KEYMAP = Object.fromEntries(Object.keys(SRC).map(k=>[norm(k),k]));
document.getElementById('files').addEventListener('change', e=>{
  [...e.target.files].forEach(f=>{
    const k = KEYMAP[norm(f.name)]; if(!k) return;
    const url = URL.createObjectURL(f);
    imgs.filter(i=>i.dataset.key===k).forEach(i=>{ i.src = url; });
  });
  setTimeout(start, 300);
});
document.getElementById('replay').addEventListener('click', start);

/* ---------- jalan ---------- */
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(loadAll).then(()=>{
  if(usedFallback) document.getElementById('pick').style.display = 'inline-block';
  start();
});
</script>
</body>
</html>
